<!DOCTYPE html>

<title>急げ！宅配便（仮）3Dプロトタイプ</title>
<style>
:root{color-scheme:dark;--orange:#FF5E00;--yellow:#FFD700;--text:#E2E8F0}

#g{position:fixed;inset:0;display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px 14px;pointer-events:none;font-weight:700;font-size:14px;text-shadow:0 1px 3px #000;display:flex;justify-content:space-between;gap:12px}
.bar{width:170px;height:12px;background:#2A364F;border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:var(--orange)}
#cross{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px;border:2px solid #fff8;border-radius:50%;pointer-events:none}
#msg{position:fixed;left:0;right:0;bottom:calc(40px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:900;font-size:20px;color:var(--yellow);text-shadow:0 2px 4px #000;pointer-events:none}
#guide{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(11,15,25,.65);border:1px solid #2A364F;border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.7;pointer-events:none;text-shadow:0 1px 2px #000}
#guide b{display:inline-block;min-width:20px;text-align:center;background:#2A364F;border-radius:4px;padding:0 5px;margin-right:6px;color:var(--yellow)}
#tut{position:fixed;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(560px,92vw);background:rgba(11,15,25,.85);border:1px solid #FFD700;border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.6;pointer-events:none;display:none;z-index:3}
#toasts{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:4;width:max-content;max-width:92vw}
.toast{background:rgba(160,20,40,.92);border:1px solid #ff6a80;color:#fff;font-weight:700;padding:8px 14px;border-radius:8px;font-size:14px;animation:tin .25s ease}
.toast.info{background:rgba(20,80,140,.92);border-color:#6ab0ff}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
#dmg{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(255,0,0,.7);opacity:0}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}
#board{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(11,15,25,.7);border:1px solid #2A364F;border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.7;pointer-events:none;display:none;min-width:150px}
#ov{position:fixed;inset:0;background:rgba(11,15,25,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer;line-height:1.7}
#ov h2{font-size:2rem;margin:0 0 8px;color:var(--yellow)}
#ov p{margin:4px 0;font-size:.95rem}
.btn{margin-top:14px;background:var(--orange);color:#111;font-weight:700;padding:10px 24px;border-radius:8px}
button.m{background:var(--orange);color:#111;font-weight:700;font-size:1rem;padding:12px;border:0;border-radius:10px;cursor:pointer;font-family:inherit}
button.m.alt{background:#2A364F;color:var(--text)}
button.m:disabled{opacity:.4;cursor:not-allowed}
.menu{display:flex;flex-direction:column;gap:10px;width:min(340px,88vw);margin-top:12px}
.menu input{padding:10px;border-radius:8px;border:1px solid #2A364F;background:#0B0F19;color:var(--text);font-size:1rem;text-align:center;font-family:inherit}
#opt{position:fixed;inset:0;background:rgba(11,15,25,.96);display:none;flex-direction:column;align-items:center;padding:20px;overflow:auto;z-index:5}
#opt .tabs{display:flex;gap:6px;margin:8px 0}
#opt .tabs button{padding:8px 14px;font-size:.9rem}
#opt .row{display:flex;align-items:center;justify-content:space-between;gap:14px;width:min(440px,92vw);padding:8px 0;border-bottom:1px solid #2A364F;font-size:.9rem}
#opt input[type=range]{width:160px}
.kb{min-width:80px;padding:5px 10px;background:#2A364F;color:var(--yellow);border:1px solid #445;border-radius:6px;cursor:pointer;font-family:inherit}
#homeBtn{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top,0px));display:none;z-index:3;padding:6px 14px;font-size:12px;opacity:.8}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="hud"><div id="l"></div><div id="r"></div></div>
<div id="board"></div>
<div id="guide"><b>WASD</b>移動<br><b>Shift</b>走る<br><b>Space</b>ジャンプ<br><b>E</b>拾う・置く<br><b>V</b>叫ぶ（爆薬箱）<br><b>Q</b>突き飛ばす（近くの相手）<br><b>R</b>リスタート</div>
<div id="cross"></div><div id="msg"></div><div id="flash"></div><div id="dmg"></div><div id="toasts"></div><div id="tut"></div>
<div id="ov"></div>
<div id="opt"></div>
<button id="homeBtn" class="m alt">☰ ホーム (M)</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const cv=$('g'),ov=$('ov');
const ren=new THREE.WebGLRenderer({canvas:cv,antialias:true});
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec7e8);scene.fog=new THREE.Fog(0x9ec7e8,30,140);
const cam=new THREE.PerspectiveCamera(72,1,.1,300);cam.rotation.order='YXZ';
scene.add(new THREE.HemisphereLight(0xffffff,0x556655,.9));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(30,60,20);scene.add(sun);
function resize(){ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

// ---- terrain ----
const SPOTS=[[0,-150],[-16,-153],[16,-148],[-8,-163],[11,-165],[-18,-142]];
const TSPOT=[0,-40];
const spotFlat=(x,z)=>{let m=1;for(const s of SPOTS.concat([TSPOT])){const dx=x-s[0],dz=z-s[1],ex=Math.max(Math.abs(dx)-10,0),ez=dz<-14?-14-dz:dz>6?dz-6:0;m=Math.min(m,Math.min(1,Math.hypot(ex,ez)/6))}return m};
const base=(x,z)=>{const d=spotFlat(x,z)*Math.min(1,Math.hypot(x,z)/14)*Math.min(1,Math.min(Math.abs(z+105),Math.abs(z+128),Math.abs(z+45),Math.abs(z+85))/9);
  return (3*Math.sin(x/9)*Math.cos(z/11)+1.5*Math.sin(z/4.3+x/7)+(z<-40?1.2*Math.sin(x/2.7)*Math.sin(z/3.1):0))*d};
const BA=base(0,-61),BB=base(0,-77),deck=z=>BA+(BB-BA)*((z+61)/-16);
const tr=z=>z>-61?0:z>-62?-61-z:z>-76?1:z>-77?z+77:0;
const PITS=[[-9,-32,2.6],[10,-52,2.6],[-13,-92,2.8],[8,-116,2.8],[-4,-135,2.6],[22,-28,2.6],[-22,-110,2.6]];
const pitAt=(x,z)=>{let m=0;for(const p of PITS){const d=Math.hypot(x-p[0],z-p[1]);m=Math.max(m,d<=p[2]?1:d<p[2]+1?p[2]+1-d:0)}return m};
const gt=(x,z)=>{const t=tr(z),hh=t===0?base(x,z):base(x,z)*(1-t)-8*t;return hh-5*pitAt(x,z)};
const gh=(x,z)=>(z<=-61&&z>=-77&&Math.abs(x)<=1.2)?deck(z):gt(x,z);
{const g=new THREE.PlaneGeometry(120,200,120,200);g.rotateX(-Math.PI/2);g.translate(0,0,-80);
 const p=g.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,gt(p.getX(i),p.getZ(i)));
 g.computeVertexNormals();
 scene.add(new THREE.Mesh(g,new THREE.MeshPhongMaterial({color:0x5c8a4a,specular:0x000000,flatShading:true})));}
const box=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);scene.add(m);return m};
{const mid=(BA+BB)/2-.1,rx=Math.atan2(BB-BA,16),dm=new THREE.Mesh(new THREE.BoxGeometry(2.4,.2,16.4),new THREE.MeshLambertMaterial({color:0x8a6a3a}));dm.position.set(0,mid,-69);dm.rotation.x=rx;scene.add(dm);
 for(const sx of[-1.15,1.15]){const e=new THREE.Mesh(new THREE.BoxGeometry(.14,.16,16.4),new THREE.MeshLambertMaterial({color:0x5a4125}));e.position.set(sx,mid+.15,-69);e.rotation.x=rx;scene.add(e)}}                 // bridge
box(3.4,2.2,6,0xFF5E00,0,gh(0,5)+1.1,5);box(2.6,1.8,2.2,0xe2e8f0,0,gh(0,8.5)+1,8.5); // truck
for(let i=0;i<25;i++){const x=(Math.random()-.5)*100,z=-10-Math.random()*150;if(Math.abs(x)<5||(z<-60&&z>-78))continue;
  const y=gh(x,z);box(.5,3,.5,0x6b4a2a,x,y+1.5,z);box(2.4,2.4,2.4,0x2f6a3a,x,y+3.6,z)}
let GX=0,GZ=-150,gy=gh(0,GZ);
const house=new THREE.Group();scene.add(house);
{const hm=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);house.add(m)};
 hm(10.4,3,6.4,0x888888,0,-.5,-9);hm(10,5,6,0xd9c9a3,0,2.5,-9);hm(1.4,2.6,.2,0x7a3b1b,0,1.3,-5.9);hm(11,.6,7,0x8a3b2b,0,5.3,-9)}
const ring=new THREE.Mesh(new THREE.CylinderGeometry(4,4,.15,32),new THREE.MeshBasicMaterial({color:0xFFD700,transparent:true,opacity:.5}));
ring.position.set(0,gy+.1,GZ);scene.add(ring);
const beam=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,70,10,1,true),new THREE.MeshBasicMaterial({color:0xFFD700,transparent:true,opacity:.3,fog:false,depthWrite:false,side:THREE.DoubleSide}));beam.position.y=35;ring.add(beam);

// ---- state ----
// ---- settings / audio ----
let roomNS,roomCode='',mode='single',runT=false,optTab='a',rebind=null,died=false,specI=0,inv=0;
const cleanName=s=>String(s==null?'':s).replace(/[<>&"'`\\]/g,'').trim().slice(0,12);
let myName='';try{myName=cleanName(localStorage.getItem('rd_name')||'')}catch(e){}
const DEF={vol:.8,se:.8,bgm:.4,mic:1,sens:1,inv:false,tog:false,kPick:'KeyE',kShout:'KeyV',kShove:'KeyQ',fov:72,hud:1,guide:true,cross:true,board:true};
let S={...DEF};try{Object.assign(S,JSON.parse(localStorage.getItem('rd_opt')||'{}'))}catch(e){}
const saveS=()=>{try{localStorage.setItem('rd_opt',JSON.stringify(S))}catch(e){}saveProfile()};
const kn=c=>String(c).replace('Key','').replace('Digit','');
function applyUI(){
  $('guide').style.display=S.guide?'block':'none';$('cross').style.display=S.cross?'block':'none';
  $('hud').style.zoom=S.hud;$('guide').style.zoom=S.hud;$('board').style.zoom=S.hud;
  cam.fov=S.fov;cam.updateProjectionMatrix();
  $('guide').innerHTML=`<b>WASD</b>移動<br><b>Shift</b>走る<br><b>Space</b>ジャンプ<br><b>${kn(S.kPick)}</b>拾う・置く<br><b>${kn(S.kShout)}</b>叫ぶ（爆薬箱）<br><b>${kn(S.kShove)}</b>突き飛ばす（近くの相手）<br><b>R</b>リスタート<br><b>P</b>ポーズ<br><b>M</b>ホームへ`;
}
let AC=null,bgmT=null,bgmI=0;
function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,slide){const a=actx();if(!a||v<=0)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+d);
  g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
const beep=(f,d,type,v,slide)=>tone(f,d,type,v*S.vol*S.se,slide);
const SE={pick:()=>beep(660,.1,'square',.25),drop:()=>beep(220,.1,'triangle',.3),ok:()=>{beep(784,.12,'square',.3);setTimeout(()=>beep(1046,.2,'square',.3),110)},break:()=>beep(900,.3,'sawtooth',.3,-800),boom:()=>beep(160,.7,'sawtooth',.5,-120),shove:()=>beep(300,.15,'square',.3,-150)};
const NOTES=[262,330,392,330,294,370,440,370,262,330,392,523,440,392,330,294];
function bgm(on){clearInterval(bgmT);bgmT=null;if(on)bgmT=setInterval(()=>tone(NOTES[bgmI++%NOTES.length],.22,'triangle',.12*S.vol*S.bgm),240)}
const K={},P={x:0,y:0,z:0,vx:0,vy:0,vz:0,yaw:0,pitch:0,g:true};
let state='ready',items=[],held=null,meter=0,tLeft=0,mic=null,micOn=false,level=0,msgT=0,ptr=false,drag=false;
const TYPES={fragile:{c:0x7fd4ff,s:.55,e:'🍷割れ物'},bomb:{c:0xd02030,s:.52,e:'💣爆薬箱'},tuna:{c:0x6f8fa8,s:.34,e:'🐟マグロ'}};
function say(t){$('msg').textContent=t;msgT=2.5}
// ---- realistic models ----
function makeModel(t){
  const g=new THREE.Group();g.rotation.order='YXZ';
  const M=(c,o)=>new THREE.MeshPhongMaterial(Object.assign({color:c,shininess:60},o||{}));
  const add=(p,geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);p.add(m);return m};
  const V=a=>a.map(q=>new THREE.Vector2(q[0],q[1]));
  if(t==='fragile'){
    add(g,new THREE.LatheGeometry(V([[0,0],[.13,0],[.13,.01],[.04,.03],[.012,.06],[.012,.2],[.03,.23],[.08,.28],[.1,.35],[.09,.43],[.075,.52]]),28),M(0xcfe9ff,{transparent:true,opacity:.38,shininess:150,specular:0xffffff,side:THREE.DoubleSide,depthWrite:false}),0,-.26,0);
    add(g,new THREE.LatheGeometry(V([[0,.25],[.07,.28],[.093,.35],[.088,.39],[0,.39]]),24),M(0x7a0b1e,{shininess:90,specular:0x886666,side:THREE.DoubleSide}),0,-.26,0);
  }else if(t==='bomb'){
    const body=add(g,new THREE.SphereGeometry(.26,28,20),M(0x1b1b22,{specular:0x9999aa,shininess:90}));
    add(g,new THREE.CylinderGeometry(.07,.085,.09,16),M(0x5a606e,{specular:0xcccccc,shininess:100}),0,.28,0);
    const ring=add(g,new THREE.TorusGeometry(.075,.015,8,16),M(0x444a55,{specular:0xaaaaaa}),0,.335,0);ring.rotation.x=Math.PI/2;
    const cv2=new THREE.CatmullRomCurve3([new THREE.Vector3(0,.33,0),new THREE.Vector3(.06,.42,0),new THREE.Vector3(.03,.5,.03),new THREE.Vector3(.1,.57,0)]);
    add(g,new THREE.TubeGeometry(cv2,16,.012,6),M(0xc9a063,{shininess:10}));
    const core=add(g,new THREE.SphereGeometry(.03,10,10),new THREE.MeshBasicMaterial({color:0xffe27a}),.1,.58,0);
    const halo=add(g,new THREE.SphereGeometry(.06,10,10),new THREE.MeshBasicMaterial({color:0xff6a00,transparent:true,opacity:.5,depthWrite:false}),.1,.58,0);
    g.userData={body,spark:{core,halo}};
  }else{
    const bg=new THREE.SphereGeometry(1,28,18),cols=[],p=bg.attributes.position,A=new THREE.Color(0x15325e),B=new THREE.Color(0xe3eaf2),C=new THREE.Color();
    for(let k=0;k<p.count;k++){const u=Math.max(0,Math.min(1,(p.getY(k)+.35)/.9));C.copy(B).lerp(A,u);cols.push(C.r,C.g,C.b)}
    bg.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
    const body=add(g,bg,M(0xffffff,{vertexColors:true,shininess:90,specular:0x99aabb}));body.scale.set(.16,.19,.46);
    const dk=M(0x15325e,{shininess:40}),yl=M(0xffd21a,{shininess:40});
    const tail=new THREE.Group();tail.position.set(0,0,.44);g.add(tail);
    const pg=new THREE.ConeGeometry(.07,.2,12);pg.rotateX(Math.PI/2);pg.translate(0,0,.1);add(tail,pg,dk);
    add(tail,new THREE.BoxGeometry(.02,.26,.1),dk,0,.07,.2).rotation.x=.5;
    add(tail,new THREE.BoxGeometry(.02,.26,.1),dk,0,-.07,.2).rotation.x=-.5;
    add(g,new THREE.BoxGeometry(.015,.14,.2),dk,0,.2,.02).rotation.x=.3;
    add(g,new THREE.BoxGeometry(.012,.08,.1),dk,0,.17,.2).rotation.x=.3;
    for(let k=0;k<5;k++)add(g,new THREE.BoxGeometry(.01,.035,.04),yl,0,.115-k*.012,.25+k*.04);
    for(const sx of[-1,1]){add(g,new THREE.BoxGeometry(.14,.015,.1),dk,sx*.15,-.08,-.12).rotation.z=sx*.5;
      add(g,new THREE.SphereGeometry(.025,10,10),M(0x050505,{shininess:150,specular:0xffffff}),sx*.115,.04,-.34)}
    g.userData={tail};
  }
  return g;
}
function animItem(i,dt){
  const m=i.m,u=m.userData,now=performance.now();
  if(i.t==='tuna'){
    const sp=Math.hypot(i.vx,i.vz),fr=i!==held,air=i.y>gh(i.x,i.z)+i.s/2+.05;
    let want=m.rotation.y;if(!fr)want=P.yaw;else if(sp>.6)want=Math.atan2(-i.vx,-i.vz);
    let d=want-m.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));m.rotation.y+=d*Math.min(1,10*dt);
    i.wag=(i.wag||0)+dt*(!fr?(i.esc<2?32:15):(sp>.6||air)?22:7);
    u.tail.rotation.y=Math.sin(i.wag)*.55;
    m.rotation.z=Math.sin(i.wag*.5)*(!fr?.18:air?.25:.1);
    m.rotation.x=fr?Math.max(-.6,Math.min(.6,i.vy*.06)):0;
  }else if(i.t==='bomb'){
    const k=1+meter*2.5;u.spark.core.scale.setScalar((.8+Math.random()*.6)*k);u.spark.halo.scale.setScalar((.8+Math.random()*.8)*k);
    u.body.material.emissive.setRGB(meter*.7,meter*.05,0);
    m.rotation.z=meter>.5?Math.sin(now/40)*.05*meter:0;
  }else{
    m.rotation.z=i===held?Math.sin(now/35)*i.stress*.15:0;
  }
}
function reset(){
  Object.assign(P,{x:0,y:gh(0,0),z:0,vx:0,vy:0,vz:0,yaw:0,pitch:0,hp:100});inv=0;
  MINES.forEach(m=>{m.on=!!m.en;m.m.visible=!!m.en});KITS.forEach(k=>{k.on=!!k.en;k.g.visible=!!k.en});
  items.forEach(i=>scene.remove(i.m));items=[];held=null;meter=0;boomTarget=null;tLeft=mode==='single'?(tutOn?900:STAGES[stage].time):170;
  (wolfMode?W9:mode==='coop'?[['fragile',-2.5,-3],['bomb',0,-3],['tuna',2.5,-3],['fragile',-1.25,-5],['bomb',1.25,-5],['tuna',3.75,-5]]:mode==='single'?(tutOn?TUTCFG.items:STAGES[stage].items):[['fragile',-2.5,-3],['bomb',0,-3],['tuna',2.5,-3]]).forEach(([t,x,z0],id)=>{
    const z=z0,s=TYPES[t].s,m=makeModel(t);m.position.set(x,0,z);scene.add(m);
    items.push({id,own:true,seen:performance.now(),sx:x,sz:z,gen:0,rt:0,t,m,s,x,y:gh(x,z)+s/2,z,vx:0,vy:0,vz:0,alive:true,done:false,stress:0,slip:0,hop:1})});
}
function kill(i,why){if(!i.alive)return;i.alive=false;i.m.visible=false;if(held===i)held=null;(why==='爆発'?SE.boom:SE.break)();say(TYPES[i.t].e+' '+why+'！');notifyLost(i,why)}
function flash(){const f=$('flash');f.style.transition='none';f.style.opacity=.9;requestAnimationFrame(()=>{f.style.transition='opacity .6s';f.style.opacity=0})}

// ---- visible boundary walls ----
const BW=[];
{const c=document.createElement('canvas');c.width=c.height=64;const g2=c.getContext('2d');g2.strokeStyle='rgba(0,240,255,.9)';g2.lineWidth=3;g2.strokeRect(0,0,64,64);
 const mk=(w,axis,px,pz,ry)=>{const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(w/4,30/4);

  if(mpT<=0){mpT=.05;room.presence({x:+P.x.toFixed(2),y:+P.y.toFixed(2),z:+P.z.toFixed(2),yaw:+P.yaw.toFixed(2),h:held?held.t:null,d:dn,l:ls,st:state==='spec'?'dead':state,tl:state==='over'&&!died?Math.round(tLeft):null,dd:died?1:0,nm:myName,sc:myScore,wl:wlOut,rd:myRd,go:myGo||null,bm:bmPos,it:mode==='coop'&&(state==='play'||state==='over')?items.filter(i=>i.own).map(i=>[i.id,+i.x.toFixed(2),+i.y.toFixed(2),+i.z.toFixed(2),(i.alive?1:0)|(i.done?2:0)|(i===held?4:0),i.gen]):null}).catch(()=>{})}
  if(mode==='coop'){const nw=performance.now();let sm=null;for(const i of items){if(!i.own&&nw-i.seen>2500){if(sm===null)sm=amSmallest();if(sm){i.own=true;i.vx=i.vy=i.vz=0}}}}
  peerWatch();const seen=new Set(),rows=[];
  for(const p of room.peers()){
    if(p.kind!=='viewer')continue;const q=p.presence||{};
    if(!p.isMe)goCheck(p,q);
    if(mode==='coop'&&!p.isMe)coopSync(p,q);
    if(typeof q.d==='number')rows.push({n:(cleanName(q.nm)||nick(p.peer)),me:p.isMe,d:q.d,l:q.l|0,st:q.st,tl:q.tl||0,pid:p.peer,dd:q.dd});
    if(p.isMe||typeof q.x!=='number'||q.st!=='play')continue;seen.add(p.peer);
    let a=avatars.get(p.peer);if(!a){a=mkAvatar(p.peer);avatars.set(p.peer,a);a.position.set(q.x,q.y,q.z)}
    const nm0=cleanName(q.nm)||nick(p.peer);if(a.userData.nm!==nm0){a.remove(a.userData.lab);a.userData.lab=label(nm0,wolfMode&&myRole==='wolf'&&wolves.includes(p.peer)?'rgba(170,20,40,.9)':null);a.add(a.userData.lab);a.userData.nm=nm0}
    const k=Math.min(1,14*dt);a.position.x+=(q.x-a.position.x)*k;a.position.y+=(q.y-a.position.y)*k;a.position.z+=(q.z-a.position.z)*k;a.rotation.y=q.yaw;
    const cb=a.userData.cb;cb.visible=!!q.h;if(q.h)cb.material.color.setHex(HC[q.h]||0xffffff)}
  for(const [id,a] of avatars)if(!seen.has(id)){scene.remove(a);avatars.delete(id)}
  if(state==='over'&&mode==='versus'&&bT<=0){const rk=$('rank');if(rk){const rs=rows.slice().sort((x,y)=>y.d-x.d||(x.dd||0)-(y.dd||0)||x.l-y.l||y.tl-x.tl);
    rk.innerHTML='<b>🏆 ランキング</b><br>'+rs.map((r,i)=>`${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${r.me?'<b>'+r.n+'（あなた）</b>':r.n} ✅${r.d} ✖${r.l} ${r.dd?'💀':r.st==='over'?'🏁':r.st==='dead'?'💀':'⏳プレイ中'}`).join('<br>')}}
  if(bT<=0){bT=.4;const b=$('board');if(state==='lobby'){b.style.display='none';lobbyRender(rows);return}
    if(mode==='coop'){b.innerHTML=(wolfMode?'🐺 人狼モード':'🤝 協力モード')+' ルーム'+clean(roomCode)+'：'+rows.length+'人<br>'+(wolfMode?'📦 配達 ✅'+items.filter(i=>i.alive&&i.done).length+'/'+items.length+'　✖'+items.filter(i=>!i.alive).length:'チーム配達 ✅'+teamScore()+'個')+'　⏱ '+Math.max(0,Math.ceil(tLeft))+'秒';b.style.display=S.board?'block':'none'}
    else if(rows.length>=1){rows.sort((x,y)=>y.d-x.d||(x.dd||0)-(y.dd||0)||x.l-y.l||y.tl-x.tl);
      b.innerHTML='⚔ 対戦モード ルーム'+clean(roomCode)+'：'+rows.length+'人<br>'+rows.map((r,i)=>`${i+1}. ${r.me?'<b>'+r.n+'</b>':r.n} ✅${r.d} ✖${r.l}${r.dd||r.st==='dead'?' 💀':r.st==='over'?' 🏁':''}`).join('<br>');b.style.display=S.board?'block':'none'}
    else b.style.display='none'}
}
// ---- home / room / options ----
async function leaveRoom(){wolfMode=false;myRole='citizen';wolves=[];wlOut=null;knownP.clear();myGo=0;for(const k in goSeen)delete goSeen[k];if(room){const r=room;room=null;try{await r.leave()}catch(e){}}for(const [,a] of avatars)scene.remove(a);avatars.clear();$('board').style.display='none';myPeer=null}
function mpStatus(){const s=$('mst');if(!s)return;s.textContent=roomNS===undefined?'接続を確認中…':roomNS?'同じ番号を入力した人と同じ部屋で遊べます':'マルチプレイはサインイン中のメンバー／招待ゲストのみ利用できます';$('bCoop').disabled=$('bVs').disabled=$('bWolf').disabled=!roomNS}
setInterval(()=>{const s=$('mst');if(state==='ready'&&s&&s.textContent.startsWith('接続'))mpStatus()},500);
async function joinRoom(code,md){
  const st=$('mst');st.textContent='入室中…';
  try{room=await roomNS.join('rd-'+code+(md==='wolf'?'-w':md==='coop'?'-c':'-v'))}catch(e){st.textContent='入室できませんでした（'+((e&&e.code)||'error')+'）';return}
  roomCode=code;wolfMode=md==='wolf';mode=wolfMode?'coop':md;joinAt=performance.now();knownP.clear();
  room.onPeers(()=>{const me=room&&room.peers().find(p=>p.isMe);if(me)myPeer=me.peer});
  room.on('shove',shoveHandler);
  
  lobby();notify('✅ '+myName+' としてルーム'+clean(code)+'に入室しました','info')}
function nameScreen(){
  state='ready';$('homeBtn').style.display='none';$('opt').style.display='none';ov.style.display='flex';
  ov.innerHTML=`<h2>急げ！宅配便（仮）</h2><p>配達員の名前を付けてください<br><span style="font-size:.8rem;color:#94a3b8">マルチプレイでは、他のプレイヤーにこの名前が表示されます</span></p><div class="menu"><input id="pn" maxlength="12" placeholder="名前（12文字まで）" value="${myName}"><button class="m" id="pnOk">決定</button><p id="pnMsg" style="font-size:.8rem;color:#ff6a80;margin:0"></p></div>`;
  const ok=()=>{const v=cleanName($('pn').value);if(!v){$('pnMsg').textContent='名前を入力してください';return}myName=v;try{localStorage.setItem('rd_name',v)}catch(e){}saveProfile();home()};
  $('pnOk').onclick=ok;$('pn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)ok()});$('pn').focus()}
function home(){paused=false;tutOn=false;$('tut').style.display='none';if(!myName){authScreen();return}
  leaveRoom();state='ready';bgm(false);held=null;mode='single';
  if(document.pointerLockElement)document.exitPointerLock();
  $('homeBtn').style.display='none';$('opt').style.display='none';ov.style.display='flex';
  ov.innerHTML=`<h2>急げ！宅配便（仮）</h2><p>ブラック宅配「ニャンバット配送」の配達員になって、<br>荷物を150m先の家まで届けよう。</p><p style="margin:2px 0;font-size:.9rem">👤 ${myName}　${myUid?'<button class="m alt" id="bLogout" style="padding:4px 10px;font-size:.8rem">ログアウト</button>':'<button class="m alt" id="bName" style="padding:4px 10px;font-size:.8rem">名前変更</button> <button class="m alt" id="bAuth" style="padding:4px 10px;font-size:.8rem">ログイン／登録</button>'}</p><p style="margin:2px 0;font-size:.78rem;color:#94a3b8;max-width:340px;line-height:1.5">${loginStatus2()}</p>
<div class="menu"><button class="m" id="bTut">🎓 チュートリアル${tutSeen()?'':'（はじめての方はこちら）'}</button><button class="m" id="bSingle">🚚 シングルプレイ</button><button class="m" id="bMulti">👥 マルチプレイ</button><button class="m alt" id="bRank">🏆 ランキング</button><button class="m alt" id="bOpt">⚙ オプション</button></div>
<div class="menu" id="sg" style="display:none"></div>
<div class="menu" id="mp" style="display:none"><input id="rc" inputmode="numeric" maxlength="12" placeholder="ルーム番号（例: 1234）"><button class="m" id="bCoop">🤝 協力モードで入室</button><button class="m" id="bVs">⚔ 対戦モードで入室</button><button class="m" id="bWolf">🐺 人狼モードで入室</button><p style="font-size:.8rem;color:#94a3b8;margin:0;line-height:1.6">🤝 協力：制限時間内にチームで何個運べるか（荷物は補充される）<br>⚔ 対戦：各自の荷物で配達数を競う<br>🐺 人狼：市民は9個の荷物を届け、人狼は妖害する</p><button class="m alt" id="bRand">ランダムな番号</button><p id="mst" style="font-size:.8rem;color:#94a3b8;margin:0"></p></div>`;
  $('bTut').onclick=startTutorial;$('bSingle').onclick=()=>{stageScreen();return;
    g.innerHTML=STAGES.map((c,i)=>`<button class="m${unlocked(i)?'':' alt'}" data-s="${i}" ${unlocked(i)?'':'disabled'}>${unlocked(i)?'':'🔒 '}ステージ${c.n}　${'★'.repeat(prog[i]||0)}${'☆'.repeat(3-(prog[i]||0))}</button>`).join('');
    g.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{stage=+b.dataset.s;mode='single';start()})};
  $('bOpt').onclick=openOpt;$('bRank').onclick=()=>openRank();if($('bName'))$('bName').onclick=nameScreen;if($('bAuth'))$('bAuth').onclick=authScreen;if($('bLogout'))$('bLogout').onclick=logout;
  $('bMulti').onclick=()=>{const m=$('mp');m.style.display=m.style.display==='none'?'flex':'none';mpStatus()};
  $('bRand').onclick=()=>{$('rc').value=String(1000+Math.floor(Math.random()*9000))};
  const go=m=>{const c=clean($('rc').value).toLowerCase().slice(0,12);if(!c){$('mst').textContent='ルーム番号を入力してください';return}joinRoom(c,m)};
  $('bCoop').onclick=()=>go('coop');$('bVs').onclick=()=>go('versus');$('bWolf').onclick=()=>go('wolf');
}
$('homeBtn').onclick=home;
function openOpt(){
  const o=$('opt');o.style.display='flex';
  const sl=(k,l,mn,mx,st)=>`<div class="row"><span>${l}</span><input type="range" data-k="${k}" min="${mn}" max="${mx}" step="${st}" value="${S[k]}"><span data-v="${k}" style="width:34px;text-align:right">${S[k]}</span></div>`;
  const ck=(k,l)=>`<div class="row"><span>${l}</span><input type="checkbox" data-c="${k}" ${S[k]?'checked':''}></div>`;
  const kb=(k,l)=>`<div class="row"><span>${l}</span><button class="kb" data-kb="${k}">${kn(S[k])}</button></div>`;
  const tabs={a:sl('vol','マスター音量',0,1,.05)+sl('se','効果音',0,1,.05)+sl('bgm','BGM',0,1,.05)+sl('mic','マイク感度',.2,3,.1),
    c:sl('sens','マウス感度',.3,3,.1)+ck('inv','視点の上下反転')+ck('tog','走るをトグル式にする(Shift)')+kb('kPick','拾う・置く')+kb('kShout','叫ぶ')+kb('kShove','突き飛ばす'),
    u:ck('guide','操作ガイドを表示')+ck('cross','照準を表示')+ck('board','スコアボードを表示')+sl('hud','HUDサイズ',.7,1.5,.1)+sl('fov','視野角(FOV)',60,100,1)};
  o.innerHTML=`<h2 style="color:var(--yellow);margin:4px 0">⚙ オプション</h2><div class="tabs">${[['a','🔊 音量'],['c','🎮 操作'],['u','🖥 UI']].map(([k,l])=>`<button class="m ${k===optTab?'':'alt'}" data-t="${k}">${l}</button>`).join('')}</div>${tabs[optTab]}<p id="kbmsg" style="color:#ff6a80;font-size:.8rem;min-height:1em;margin:4px 0"></p><div class="menu"><button class="m alt" id="oReset">初期値に戻す</button><button class="m" id="oBack">戻る</button></div>`;
  o.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{optTab=b.dataset.t;openOpt()});
  o.querySelectorAll('input[type=range]').forEach(r=>{r.oninput=()=>{S[r.dataset.k]=+r.value;o.querySelector(`[data-v="${r.dataset.k}"]`).textContent=r.value;saveS();applyUI()};r.onchange=()=>SE.pick()});
  o.querySelectorAll('[data-c]').forEach(c=>c.onchange=()=>{S[c.dataset.c]=c.checked;saveS();applyUI()});
  o.querySelectorAll('[data-kb]').forEach(b=>b.onclick=()=>{
    o.querySelectorAll('[data-kb]').forEach(x=>{x.disabled=x!==b});b.textContent='キーを押す…';
    const RES=['KeyW','KeyA','KeyS','KeyD','Space','ShiftLeft','ShiftRight','KeyM','KeyR','KeyP','KeyF','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
    rebind=code=>{
      if(code==='Escape'){rebind=null;openOpt();return}
      const dup=['kPick','kShout','kShove'].some(k=>k!==b.dataset.kb&&S[k]===code);
      if(RES.includes(code)||dup){const m=$('kbmsg');if(m)m.textContent=(RES.includes(code)?'そのキーは他の操作で使われています':'同じキーを複数の操作に割り当てられません')+'。別のキーを押してください';return}
      S[b.dataset.kb]=code;saveS();applyUI();rebind=null;openOpt()}});
  $('oReset').onclick=()=>{S={...DEF};saveS();applyUI();openOpt()};
  $('oBack').onclick=()=>{o.style.display='none'};
}
let last=0;
(function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(micOn){const d=new Uint8Array(mic.fftSize);mic.getByteTimeDomainData(d);let s=0;for(const v of d){const x=(v-128)/128;s+=x*x}level=Math.min(1,Math.sqrt(s/d.length)*5*S.mic)}
  if(state==='play'){if(!paused)update(dt)}else if(state==='spec')spec(dt);else if(state==='ready'||state==='lobby'){cam.position.set(0,6,20);cam.lookAt(0,1,-20)}
  mpUpdate(dt);ring.rotation.y+=dt;ren.render(scene,cam);requestAnimationFrame(loop)})(0);
applyStage(FULL);reset();planGoal();applyUI();home();
</script>
